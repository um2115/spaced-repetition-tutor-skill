[project]
name = "spaced-repetition-tutor-skill"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["migrations/schema/tests", "migrations/runner/tests"]
